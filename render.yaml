# =======================================================================
# Render Blueprint (render.yaml) — Frontend Static Site
# Place this file at the ROOT of your frontend GitHub repo:
#   Warehouse_frontend
# =======================================================================

services:
  - type: static
    name: tgswc-warehouse-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    region: singapore          # Match backend region for lower CORS latency
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Set to your deployed Render backend URL (no trailing slash)
      - key: VITE_API_URL
        sync: false            # e.g. https://tgswc-warehouse-backend.onrender.com/api
